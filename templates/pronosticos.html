{% extends "layout.html" %}
{% block content %}
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">📋 Captura de Pronósticos por Jornada</h2>
        <button class="btn btn-success" onclick="abrirModal('')">➕ Nuevo Pronóstico</button>
    </div>

    <!-- Selector de jornada -->
    <div class="mb-3">
        <label for="jornadaSelect" class="form-label">Selecciona Jornada:</label>
        <select id="jornadaSelect" class="form-select" onchange="location='?jornada='+this.value;">
            {% for j in jornadas %}
            <option value="{{ j }}" {% if j==jornada_sel %}selected{% endif %}>{{ j }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Grid de usuarios -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 mb-4">
        {% for u in usuarios_existentes %}
        <div class="col">
            <div class="card h-100 text-center">
                <div class="card-body d-flex flex-column justify-content-center">
                    <h6 class="card-title">{{ u }}</h6>
                    <button class="btn btn-primary mt-2" onclick="abrirModal('{{ u }}')">Editar Pronósticos</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalPronostico" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content">
                <form method="POST" id="formPronosticos">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Nuevo Pronóstico</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body" style="max-height: calc(100vh - 200px); overflow-y: auto;">
                        <div class="mb-3">
                            <label for="modal_usuario" class="form-label">Nombre del participante:</label>
                            <input type="text" class="form-control" id="modal_usuario" name="usuario" required>
                        </div>

                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                            {% for p in partidos %}
                            <div class="col">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h6 class="card-title">
                                            <img src="{{ url_for('static', filename='img/equipos/' ~ get_logo_slug(p.local) ~ '.png') }}"
                                                 alt="{{ p.local }}" width="32" height="32">
                                            {{ p.local }} vs 
                                            <img src="{{ url_for('static', filename='img/equipos/' ~ get_logo_slug(p.visitante) ~ '.png') }}"
                                                 alt="{{ p.visitante }}" width="32" height="32">
                                            {{ p.visitante }}
                                        </h6>
                                        <select class="form-select" name="partido_{{ p.id }}" id="select_{{ p.id }}" required>
                                            <option value="">-- Selecciona --</option>
                                            <option value="local">{{ p.local }} gana</option>
                                            <option value="empate">Empate</option>
                                            <option value="visitante">{{ p.visitante }} gana</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Guardar Pronósticos</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script>
  const pronosticosPrevios = {{ pronosticos_previos | tojson }};

  function abrirModal(usuario) {
    const inputUsuario = document.getElementById("modal_usuario");
    inputUsuario.value = usuario;

    const selects = document.querySelectorAll("#modalPronostico select");
    selects.forEach(sel => sel.value = "");

    if (usuario && pronosticosPrevios[usuario]) {
      for (const [partidoId, pron] of Object.entries(pronosticosPrevios[usuario])) {
        const select = document.getElementById("select_" + partidoId);
        if (select) select.value = pron;
      }
    }

    const modal = new bootstrap.Modal(document.getElementById("modalPronostico"));
    modal.show();
  }
</script>
{% endblock %}
